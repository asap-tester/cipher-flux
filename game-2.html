<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CIPHER FLUX // BOOT SEQUENCE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#010307;--cyan:#00e5ff;--soft:#7ef9ff;--mag:#ff2bd6}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#d6f6ff;font-family:'Orbitron',sans-serif}

/* ── Canvas ── */
canvas{position:fixed;inset:0;z-index:0}

/* ── Scanlines + vignette ── */
.scanlines{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,229,255,.04) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay}
.scanlines::after{content:'';position:absolute;left:0;right:0;height:120px;
  background:linear-gradient(to bottom,transparent,rgba(0,229,255,.15),transparent);
  animation:beam 4s linear infinite}
@keyframes beam{0%{top:-15%}100%{top:115%}}
.vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.96) 100%)}

/* ── HUD corners ── */
.hud{position:fixed;inset:20px;z-index:20;pointer-events:none}
.corner{position:absolute;width:42px;height:42px;border:1px solid var(--cyan);
  box-shadow:0 0 12px rgba(0,229,255,.5);animation:cp 2.5s ease-in-out infinite}
.tl{top:0;left:0;border-right:none;border-bottom:none}
.tr{top:0;right:0;border-left:none;border-bottom:none}
.bl{bottom:0;left:0;border-right:none;border-top:none}
.br{bottom:0;right:0;border-left:none;border-top:none}
@keyframes cp{50%{box-shadow:0 0 26px var(--cyan)}}
.ht{position:absolute;font-family:'Share Tech Mono',monospace;font-size:11px;
  letter-spacing:.2em;color:var(--soft)}
.htl{top:10px;left:58px}.htr{top:10px;right:58px;text-align:right}
.hbl{bottom:10px;left:58px}.hbr{bottom:10px;right:58px;text-align:right}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}

/* ── REACTOR — fixed dead-center, independent of everything ── */
#reactor-wrap{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:min(260px,42vmin);
  height:min(260px,42vmin);
  z-index:5;
  pointer-events:none;
}
#reactor-wrap .r{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(0,229,255,.3)}
#reactor-wrap .r1{animation:rot 14s linear infinite;border-style:dashed;border-color:var(--cyan)}
#reactor-wrap .r2{inset:10%;animation:rot 9s linear infinite reverse;border-color:rgba(0,229,255,.4)}
#reactor-wrap .r3{inset:22%;animation:rot 6s linear infinite;border-style:dotted;border-color:var(--cyan)}
#reactor-wrap .r4{inset:34%;border:2px solid var(--cyan);
  box-shadow:0 0 28px var(--cyan),inset 0 0 28px var(--cyan)}
@keyframes rot{to{transform:rotate(360deg)}}
.orbit{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:90%;height:90%;border-radius:50%;animation:rot 8s linear infinite}
.orbit b{position:absolute;top:-4px;left:50%;width:9px;height:9px;border-radius:50%;
  background:var(--cyan);box-shadow:0 0 12px var(--cyan),0 0 24px var(--cyan);
  transform:translateX(-50%)}
.orbit2{animation-duration:5s;animation-direction:reverse;width:70%;height:70%}
.orbit2 b{background:var(--mag);box-shadow:0 0 12px var(--mag),0 0 24px var(--mag)}
.core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:36%;height:36%;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,var(--cyan) 30%,rgba(0,229,255,.15) 65%,transparent 80%);
  box-shadow:0 0 50px var(--cyan),0 0 100px var(--cyan);
  animation:corep 1.6s ease-in-out infinite}
@keyframes corep{50%{transform:translate(-50%,-50%) scale(1.14)}}

/* ── BOOT STAGE — top + bottom strips, reactor floats in middle ── */
#stage{position:fixed;inset:0;z-index:10;pointer-events:none}

/* top strip: micro label */
#stage-top{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  margin-top:calc(-1 * (min(260px,42vmin) / 2) - 32px);
  text-align:center;width:100%;
}
.micro{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.45em;color:rgba(126,249,255,.55)}

/* bottom strip: boot log + bar + status */
#stage-bot{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  margin-top:calc((min(260px,42vmin) / 2) + 24px);
  display:flex;flex-direction:column;align-items:center;gap:16px;
  width:min(520px,88vw);
}

.boot{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.14em;
  color:var(--soft);text-align:left;width:100%;height:100px;overflow:hidden;
  border-left:2px solid var(--cyan);padding-left:12px}
.boot div{opacity:0;animation:bi .3s forwards}
.boot .ok{color:var(--cyan)}.boot .err{color:var(--mag)}
@keyframes bi{to{opacity:1}}

.bar-wrap{width:100%;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.28em}
.bar-top{display:flex;justify-content:space-between;color:var(--soft);margin-bottom:7px}
.bar{height:13px;border:1px solid var(--cyan);position:relative;
  background:rgba(0,229,255,.04);
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);
  box-shadow:0 0 14px rgba(0,229,255,.35)}
.bar .fill{position:absolute;inset:0;width:0%;
  background:linear-gradient(90deg,var(--cyan),#fff,var(--cyan));
  background-size:200% 100%;animation:shine 1.5s linear infinite;
  transition:width .18s linear}
@keyframes shine{to{background-position:200% 0}}

.status{font-family:'Orbitron',sans-serif;font-weight:700;
  font-size:clamp(13px,1.8vw,18px);letter-spacing:.4em;
  color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* shake on high load */
.shake{animation:shk .1s infinite}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}75%{transform:translate(1px,-1px)}}

/* ── Glitch slice ── */
#glitch{position:fixed;left:0;right:0;z-index:30;opacity:0;pointer-events:none;
  background:var(--cyan);mix-blend-mode:screen;box-shadow:0 0 10px var(--cyan)}

/* ── Flash ── */
#flash{position:fixed;inset:0;background:#fff;z-index:50;opacity:0;pointer-events:none}
#flash.go{animation:fl 1s ease forwards}
@keyframes fl{0%{opacity:0}35%{opacity:.95}100%{opacity:0}}

/* ── COMPLETE SCREEN ── */
/* Uses visibility + opacity instead of display:none to avoid layout flash */
#complete{
  position:fixed;inset:0;z-index:40;
  display:flex;                  /* always flex — never toggled */
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  text-align:center;
  background:radial-gradient(ellipse at center,rgba(0,229,255,.1),transparent 62%);
  visibility:hidden;             /* hidden by default */
  opacity:0;
  transition:opacity .6s ease;  /* smooth fade in */
}
#complete.show{
  visibility:visible;
  opacity:1;
}
#complete .comp-micro{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.5em;color:rgba(126,249,255,.55)}
#complete h2{
  font-size:clamp(2.6rem,8vw,6rem);font-weight:900;letter-spacing:.15em;
  color:#eafcff;line-height:1.1;
  text-shadow:0 0 20px var(--cyan),0 0 60px var(--cyan);
  animation:glow 1.8s ease-in-out infinite;
}
@keyframes glow{50%{text-shadow:0 0 40px var(--cyan),0 0 100px var(--cyan),0 0 160px var(--cyan)}}
#complete .comp-sub{font-family:'Share Tech Mono',monospace;
  font-size:clamp(.65rem,1.4vw,.9rem);letter-spacing:.4em;color:var(--soft)}
#complete .comp-load{font-family:'Share Tech Mono',monospace;
  font-size:.65rem;letter-spacing:.35em;color:rgba(0,229,255,.45);margin-top:4px}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<!-- Reactor — fully independent, always at viewport center -->
<div id="reactor-wrap">
  <div class="r r1"></div>
  <div class="r r2"></div>
  <div class="r r3"></div>
  <div class="r r4"></div>
  <div class="orbit"><b></b></div>
  <div class="orbit orbit2"><b></b></div>
  <div class="core"></div>
</div>

<!-- Boot stage: top label + bottom info strips -->
<div id="stage">
  <div id="stage-top">
    <div class="micro">// CIPHER.FLUX // INITIATING NEURAL HANDSHAKE</div>
  </div>
  <div id="stage-bot">
    <div class="boot" id="boot"></div>
    <div class="bar-wrap">
      <div class="bar-top"><span>LOADING CORTEX.MOD</span><span id="pct">000%</span></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
    <div class="status" id="status">INITIALIZING<span class="dots"></span></div>
  </div>
</div>

<!-- Glitch + effects -->
<div id="glitch"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- HUD -->
<div class="hud">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="ht htl">◉ BOOT SEQUENCE <span class="blink">ACTIVE</span></div>
  <div class="ht htr">NODE.0xAF3C // SECTOR 7G</div>
  <div class="ht hbl">FLUX <span id="flx">02.4</span> Hz</div>
  <div class="ht hbr">UPLINK <span class="blink">▮▮▮▮▮</span></div>
</div>

<div id="flash"></div>

<!-- Complete — always display:flex, toggled via visibility/opacity only -->
<div id="complete">
  <div class="comp-micro">// HANDSHAKE COMPLETE</div>
  <h2>WELCOME,<br>OPERATOR</h2>
  <div class="comp-sub">NEURAL LINK ESTABLISHED // FLUX STABILIZED</div>
  <div class="comp-load">ENTERING CIPHER ENGINE<span class="dots"></span></div>
</div>

<script>
/* ── Warp canvas ── */
const cv=document.getElementById('cv'),x=cv.getContext('2d');
let W,H,CX,CY,DPR=Math.min(devicePixelRatio||1,2);
function rs(){
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  x.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2;CY=H/2;
}
addEventListener('resize',rs);rs();

const FOCAL=260,FAR=1400,SPD=14;
const stars=[],rings=[];
function spawnStar(s){
  const a=Math.random()*Math.PI*2,r=(Math.random()*.9+.1)*Math.max(W,H);
  s.x=Math.cos(a)*r;s.y=Math.sin(a)*r;
  s.z=FAR*(.2+Math.random()*.8);s.pz=s.z;
}
for(let i=0;i<300;i++){const s={};spawnStar(s);stars.push(s)}
for(let i=0;i<14;i++)rings.push({z:FAR*(i/14)+10});

function proj(px,py,pz){const k=FOCAL/pz;return{sx:px*k+CX,sy:py*k+CY}}

function draw(){
  x.fillStyle='rgba(1,3,7,.27)';x.fillRect(0,0,W,H);
  for(const r of rings){
    r.z-=SPD*.9;if(r.z<2)r.z=FAR;
    const rad=380*(FOCAL/r.z);
    if(rad<2||rad>Math.max(W,H)*1.4)continue;
    const a=Math.min(.55,(1-r.z/FAR)*.7);
    x.strokeStyle=`rgba(0,229,255,${a})`;
    x.lineWidth=1+(1-r.z/FAR)*1.5;
    x.shadowColor='rgba(0,229,255,.8)';x.shadowBlur=12*(1-r.z/FAR);
    x.beginPath();x.arc(CX,CY,rad,0,Math.PI*2);x.stroke();
  }
  x.shadowBlur=0;
  for(const s of stars){
    s.pz=s.z;s.z-=SPD;
    if(s.z<2){spawnStar(s);continue}
    const p1=proj(s.x,s.y,s.pz),p2=proj(s.x,s.y,s.z);
    if(p2.sx<-20||p2.sx>W+20||p2.sy<-20||p2.sy>H+20){spawnStar(s);continue}
    const depth=1-s.z/FAR,a=Math.min(1,depth*1.4),r=Math.max(.4,depth*2.4);
    x.strokeStyle=`rgba(126,249,255,${a*.7})`;x.lineWidth=r;
    x.beginPath();x.moveTo(p1.sx,p1.sy);x.lineTo(p2.sx,p2.sy);x.stroke();
    x.fillStyle=`rgba(230,253,255,${a})`;
    x.beginPath();x.arc(p2.sx,p2.sy,r,0,Math.PI*2);x.fill();
  }
  requestAnimationFrame(draw);
}
draw();

/* ── Boot log ── */
const LINES=[
  ['> NEURAL.SYS v2.087 boot..','ok'],
  ['> mounting CORTEX.MOD','ok'],
  ['> verifying quantum key 0xAF3C...','ok'],
  ['> decrypting pattern lattice','ok'],
  ['> WARN: flux fluctuation detected','err'],
  ['> stabilizing harmonics','ok'],
  ['> linking synaptic threads [1024]','ok'],
  ['> uplink handshake .. SYNC 99.7%','ok'],
  ['> calibrating cipher matrix','ok'],
  ['> READY','ok'],
];
const bootEl=document.getElementById('boot');
let li=0;
function nextLine(){
  if(li>=LINES.length)return;
  const[txt,cls]=LINES[li++];
  const d=document.createElement('div');d.className=cls;d.textContent=txt;
  bootEl.appendChild(d);
  if(bootEl.children.length>5)bootEl.children[0].remove();
  setTimeout(nextLine,360+Math.random()*240);
}
nextLine();

/* ── Progress ── */
const fillEl=document.getElementById('fill');
const pctEl=document.getElementById('pct');
const statusEl=document.getElementById('status');
const STAGES=['INITIALIZING','DECRYPTING','LINKING','CALIBRATING','SYNCING','READY'];
const stageBot=document.getElementById('stage-bot');
let p=0;

function tick(){
  p+=Math.random()*2.4+0.6;
  if(p>=100){p=100;done();return}
  fillEl.style.width=p+'%';
  pctEl.textContent=String(Math.floor(p)).padStart(3,'0')+'%';
  statusEl.innerHTML=STAGES[Math.min(STAGES.length-1,Math.floor(p/18))]+'<span class="dots"></span>';
  if(Math.random()<.08)glitch();
  if(p>70)stageBot.classList.add('shake');else stageBot.classList.remove('shake');
  setTimeout(tick,80+Math.random()*120);
}

setInterval(()=>{document.getElementById('flx').textContent=(1.8+Math.random()*1.4).toFixed(1)},320);

const glitchEl=document.getElementById('glitch');
function glitch(){
  glitchEl.style.top=(Math.random()*95)+'%';
  glitchEl.style.height=(2+Math.random()*12)+'px';
  glitchEl.style.opacity='.85';
  setTimeout(()=>glitchEl.style.opacity='0',75);
}

function done(){
  fillEl.style.width='100%';
  pctEl.textContent='100%';
  statusEl.textContent='READY';
  stageBot.classList.remove('shake');

  /* flash */
  document.getElementById('flash').classList.add('go');

  setTimeout(()=>{
    /* hide boot stage */
    document.getElementById('stage').style.visibility='hidden';

    /* show complete — visibility toggle, no display change = no layout flash */
    document.getElementById('complete').classList.add('show');

    /* redirect after welcome */
    setTimeout(()=>{ window.location.href='cipher-flux.html'; }, 2600);
  }, 700);
}

setTimeout(tick, 400);
</script>
</body>
</html>
