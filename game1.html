<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CIPHER FLUX // BOOT SEQUENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#010307;
    --cyan:#00e5ff;
    --cyan-soft:#7ef9ff;
    --cyan-dim:rgba(0,229,255,0.22);
    --magenta:#ff2bd6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:#d6f6ff;font-family:'Orbitron',sans-serif}

  canvas#stars{position:fixed;inset:0;z-index:0;display:block}

  /* warp tunnel handled entirely in canvas for cohesive flow */

  /* hex grid bg */
  .hex{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.35;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,229,255,0.1), transparent 60%);
  }

  /* scanlines + vignette */
  .scan{
    position:fixed;inset:0;pointer-events:none;z-index:20;
    background:repeating-linear-gradient(to bottom, rgba(0,229,255,0.05) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  .scan::after{
    content:'';position:absolute;left:0;right:0;height:140px;
    background:linear-gradient(to bottom, transparent, rgba(0,229,255,0.18), transparent);
    animation:scanBeam 4s linear infinite;
  }
  @keyframes scanBeam{0%{top:-20%}100%{top:120%}}

  .vignette{position:fixed;inset:0;pointer-events:none;z-index:21;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.95) 100%)}

  /* HUD corners */
  .hud{position:fixed;inset:20px;z-index:15;pointer-events:none}
  .corner{position:absolute;width:42px;height:42px;border:1px solid var(--cyan);
    box-shadow:0 0 12px rgba(0,229,255,0.6);animation:hp 2.5s ease-in-out infinite}
  .tl{top:0;left:0;border-right:none;border-bottom:none}
  .tr{top:0;right:0;border-left:none;border-bottom:none}
  .bl{bottom:0;left:0;border-right:none;border-top:none}
  .br{bottom:0;right:0;border-left:none;border-top:none}
  @keyframes hp{50%{box-shadow:0 0 28px var(--cyan)}}

  .hud-text{position:absolute;font-family:'Share Tech Mono',monospace;font-size:11px;
    letter-spacing:.2em;color:var(--cyan-soft);text-shadow:0 0 8px var(--cyan)}
  .htl{top:10px;left:58px}.htr{top:10px;right:58px;text-align:right}
  .hbl{bottom:10px;left:58px}.hbr{bottom:10px;right:58px;text-align:right}
  .blink{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}

  /* main stage */
  main{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;gap:32px;
  }

  /* central reactor — locked to viewport center */
  .reactor{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(420px,70vmin);height:min(420px,70vmin);
    z-index:11;pointer-events:none;
  }
  .reactor .r{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid var(--cyan-dim);
  }
  .reactor .r1{animation:rot 14s linear infinite;border-style:dashed;border-color:var(--cyan)}
  .reactor .r2{inset:10%;animation:rot 9s linear infinite reverse;border-color:rgba(0,229,255,0.4)}
  .reactor .r3{inset:22%;animation:rot 6s linear infinite;border-style:dotted;border-color:var(--cyan)}
  .reactor .r4{inset:34%;border:2px solid var(--cyan);box-shadow:0 0 30px var(--cyan), inset 0 0 30px var(--cyan)}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* tick marks around outer ring */
  .reactor .ticks{position:absolute;inset:-4%;border-radius:50%;animation:rot 30s linear infinite}
  .reactor .ticks i{
    position:absolute;top:0;left:50%;width:2px;height:14px;
    background:var(--cyan);transform-origin:1px calc(50vmin);
    box-shadow:0 0 6px var(--cyan);
  }

  /* core */
  .core{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:38%;height:38%;border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--cyan) 30%, rgba(0,229,255,0.2) 60%, transparent 80%);
    box-shadow:0 0 60px var(--cyan), 0 0 120px var(--cyan), 0 0 200px rgba(0,229,255,0.6);
    animation:corePulse 1.6s ease-in-out infinite;
  }
  @keyframes corePulse{
    0%,100%{transform:translate(-50%,-50%) scale(1);filter:hue-rotate(0deg)}
    50%{transform:translate(-50%,-50%) scale(1.12);filter:hue-rotate(20deg)}
  }

  /* orbiting dots */
  .orbit{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:90%;height:90%;border-radius:50%;animation:rot 8s linear infinite}
  .orbit b{position:absolute;top:-4px;left:50%;width:10px;height:10px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 14px var(--cyan), 0 0 28px var(--cyan);transform:translateX(-50%)}
  .orbit2{animation-duration:5s;animation-direction:reverse;width:70%;height:70%}
  .orbit2 b{background:var(--magenta);box-shadow:0 0 14px var(--magenta), 0 0 28px var(--magenta)}

  /* boot text */
  .boot{
    font-family:'Share Tech Mono',monospace;font-size:13px;
    letter-spacing:.15em;color:var(--cyan-soft);text-align:left;
    width:min(560px,90vw);height:140px;overflow:hidden;
    border-left:2px solid var(--cyan);padding-left:14px;
    text-shadow:0 0 6px rgba(0,229,255,0.5);
  }
  .boot div{opacity:0;animation:bootIn .3s forwards}
  .boot .ok{color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
  .boot .err{color:var(--magenta);text-shadow:0 0 8px var(--magenta)}
  @keyframes bootIn{to{opacity:1}}

  /* progress */
  .progress-wrap{width:min(560px,90vw);font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.3em}
  .progress-top{display:flex;justify-content:space-between;color:var(--cyan-soft);margin-bottom:8px}
  .bar{
    height:14px;border:1px solid var(--cyan);position:relative;
    background:rgba(0,229,255,0.05);
    clip-path:polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    box-shadow:0 0 15px rgba(0,229,255,0.4);
  }
  .bar .fill{
    position:absolute;inset:0;width:0%;
    background:linear-gradient(90deg, var(--cyan), #fff, var(--cyan));
    box-shadow:0 0 20px var(--cyan);
    background-size:200% 100%;
    animation:shine 1.5s linear infinite;
    transition:width .2s linear;
  }
  @keyframes shine{to{background-position:200% 0}}

  /* status */
  .status{
    font-family:'Orbitron',sans-serif;font-weight:700;
    font-size:clamp(16px,2vw,22px);letter-spacing:.4em;
    color:var(--cyan);text-shadow:0 0 12px var(--cyan), 0 0 24px var(--cyan);
  }
  .status .dots::after{content:'';animation:dots 1.2s steps(4) infinite}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

  /* title micro */
  .micro{
    font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.5em;
    color:rgba(126,249,255,0.6);
  }

  /* flash overlay on completion */
  .flash{position:fixed;inset:0;background:#fff;z-index:50;opacity:0;pointer-events:none}
  .flash.go{animation:flash 1.2s ease forwards}
  @keyframes flash{
    0%{opacity:0}
    40%{opacity:1}
    100%{opacity:0}
  }

  /* enter complete title */
  .complete{
    position:fixed;inset:0;z-index:40;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:24px;
    background:radial-gradient(ellipse at center, rgba(0,229,255,0.15), transparent 60%);
  }
  .complete.show{display:flex;animation:fadeIn .8s ease both}
  .complete h2{
    font-size:clamp(40px,8vw,110px);font-weight:900;letter-spacing:.15em;
    color:#eafcff;text-shadow:0 0 20px var(--cyan), 0 0 60px var(--cyan);
    animation:bigPulse 1.6s ease-in-out infinite;
  }
  @keyframes bigPulse{50%{text-shadow:0 0 40px var(--cyan), 0 0 100px var(--cyan), 0 0 160px var(--cyan)}}
  .complete p{font-family:'Share Tech Mono',monospace;letter-spacing:.4em;color:var(--cyan-soft)}
  .complete a{
    font-family:'Orbitron';font-weight:700;font-size:13px;letter-spacing:.4em;
    color:var(--cyan-soft);text-decoration:none;
    padding:14px 28px;border:1px solid var(--cyan-dim);
    transition:all .2s;
  }
  .complete a:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,0.06)}
  @keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

  /* screen shake during boot */
  .shake{animation:shk .12s infinite}
  @keyframes shk{
    0%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}
    50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,-1px)}
    100%{transform:translate(1px,1px)}
  }

  /* glitch slice */
  .glitch{position:fixed;left:0;right:0;height:8px;background:var(--cyan);
    z-index:30;opacity:0;pointer-events:none;mix-blend-mode:screen;
    box-shadow:0 0 12px var(--cyan)}
</style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="hex"></div>

  <div class="hud">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="hud-text htl">◉ BOOT SEQUENCE <span class="blink">ACTIVE</span></div>
    <div class="hud-text htr">NODE.0xAF3C // SECTOR 7G</div>
    <div class="hud-text hbl">FLUX <span id="flx">02.4</span> Hz</div>
    <div class="hud-text hbr">UPLINK <span class="blink">▮▮▮▮▮</span></div>
  </div>

  <main id="stage">
    <div class="micro">// CIPHER.FLUX // INITIATING NEURAL HANDSHAKE</div>

    <div class="reactor">
      <div class="r r1"></div>
      <div class="r r2"></div>
      <div class="r r3"></div>
      <div class="r r4"></div>
      <div class="orbit"><b></b></div>
      <div class="orbit orbit2"><b></b></div>
      <div class="core"></div>
    </div>

    <div class="boot" id="boot"></div>

    <div class="progress-wrap">
      <div class="progress-top">
        <span>LOADING CORTEX.MOD</span>
        <span id="pct">000%</span>
      </div>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>

    <div class="status">INITIALIZING<span class="dots"></span></div>
  </main>

  <div class="glitch" id="glitch"></div>
  <div class="scan"></div>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>

  <div class="complete" id="complete">
    <div class="micro">// HANDSHAKE COMPLETE</div>
    <h2>WELCOME, OPERATOR</h2>
    <p>NEURAL LINK ESTABLISHED // FLUX STABILIZED</p>
    <p style="font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.3em;color:rgba(0,229,255,0.5);margin-top:8px">LOADING CIPHER ENGINE<span class="dots"></span></p>
  </div>

<script>
/* ===== Cohesive hyperspace warp: stars + rings share one vanishing point ===== */
const c=document.getElementById('stars'), x=c.getContext('2d');
let W,H,CX,CY,DPR=Math.min(window.devicePixelRatio||1,2);
function rs(){
  W=innerWidth;H=innerHeight;
  c.width=W*DPR;c.height=H*DPR;
  c.style.width=W+'px';c.style.height=H+'px';
  x.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2;CY=H/2;
}
addEventListener('resize',rs);rs();

const FOCAL=260;          // perspective focal length
const FAR=1400;           // spawn depth
const SPEED=14;           // forward speed (z per frame)

// stars distributed in a 3D frustum
const stars=[];
function spawnStar(s){
  // angle around center, radius in screen-units at z=FAR (so they appear off-screen and fly in toward you)
  const ang=Math.random()*Math.PI*2;
  const rad=(Math.random()*0.9+0.1)*Math.max(W,H);
  s.x=Math.cos(ang)*rad;
  s.y=Math.sin(ang)*rad;
  s.z=FAR*(0.2+Math.random()*0.8);
  s.pz=s.z;
}
for(let i=0;i<320;i++){const s={};spawnStar(s);stars.push(s)}

// concentric warp rings travelling on same z axis
const rings=[];
const RING_COUNT=14;
for(let i=0;i<RING_COUNT;i++){
  rings.push({z:FAR*(i/RING_COUNT)+10});
}

function project(px,py,pz){
  const k=FOCAL/pz;
  return {sx:px*k+CX, sy:py*k+CY, k};
}

function draw(){
  // trail fade — soft so streaks linger
  x.fillStyle='rgba(1,3,7,0.28)';
  x.fillRect(0,0,W,H);

  // ---- rings (behind stars) ----
  for(const r of rings){
    r.z-=SPEED*0.9;
    if(r.z<2) r.z=FAR;
    const k=FOCAL/r.z;
    // base radius in world: 380 — gives a tunnel feel
    const radius=380*k;
    if(radius<2||radius>Math.max(W,H)*1.4) continue;
    const alpha=Math.min(0.55,(1-r.z/FAR)*0.7);
    x.strokeStyle=`rgba(0,229,255,${alpha})`;
    x.lineWidth=1+ (1-r.z/FAR)*1.5;
    x.shadowColor='rgba(0,229,255,0.8)';
    x.shadowBlur=12*(1-r.z/FAR);
    x.beginPath();
    x.arc(CX,CY,radius,0,Math.PI*2);
    x.stroke();
    // tick marks on ring
    if(r.z<FAR*0.6){
      const ticks=24;
      for(let i=0;i<ticks;i++){
        const a=(i/ticks)*Math.PI*2;
        const x1=CX+Math.cos(a)*radius;
        const y1=CY+Math.sin(a)*radius;
        const x2=CX+Math.cos(a)*(radius+6*(1-r.z/FAR)*3);
        const y2=CY+Math.sin(a)*(radius+6*(1-r.z/FAR)*3);
        x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
      }
    }
  }
  x.shadowBlur=0;

  // ---- stars ----
  for(const s of stars){
    s.pz=s.z;
    s.z-=SPEED;
    if(s.z<2){spawnStar(s);continue}
    const p1=project(s.x,s.y,s.pz);
    const p2=project(s.x,s.y,s.z);
    // off-screen cull
    if(p2.sx<-20||p2.sx>W+20||p2.sy<-20||p2.sy>H+20){spawnStar(s);continue}
    const depth=1-s.z/FAR;
    const a=Math.min(1,depth*1.4);
    const r=Math.max(.4,depth*2.4);
    // streak
    x.strokeStyle=`rgba(126,249,255,${a*0.7})`;
    x.lineWidth=r;
    x.beginPath();x.moveTo(p1.sx,p1.sy);x.lineTo(p2.sx,p2.sy);x.stroke();
    // head
    x.fillStyle=`rgba(230,253,255,${a})`;
    x.beginPath();x.arc(p2.sx,p2.sy,r,0,Math.PI*2);x.fill();
  }

  // central bright glow at vanishing point
  const g=x.createRadialGradient(CX,CY,0,CX,CY,180);
  g.addColorStop(0,'rgba(0,229,255,0.35)');
  g.addColorStop(0.4,'rgba(0,229,255,0.08)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;
  x.fillRect(CX-200,CY-200,400,400);

  requestAnimationFrame(draw);
}
draw();

/* reactor tick marks */
const ticks=document.createElement('div');ticks.className='ticks';
document.querySelector('.reactor').prepend(ticks);
for(let i=0;i<60;i++){
  const t=document.createElement('i');
  t.style.transform=`rotate(${i*6}deg)`;
  if(i%5!==0){t.style.opacity=.4;t.style.height='6px'}
  ticks.appendChild(t);
}

/* boot log */
const lines=[
  ['> NEURAL.SYS v2.087 boot..','ok'],
  ['> mounting CORTEX.MOD','ok'],
  ['> verifying quantum key 0xAF3C...','ok'],
  ['> decrypting pattern lattice','ok'],
  ['> WARN: flux fluctuation detected','err'],
  ['> stabilizing harmonics','ok'],
  ['> linking synaptic threads [1024]','ok'],
  ['> uplink handshake .. SYNC 99.7%','ok'],
  ['> calibrating cipher matrix','ok'],
  ['> READY','ok'],
];
const boot=document.getElementById('boot');
let li=0;
function nextLine(){
  if(li>=lines.length)return;
  const [txt,cls]=lines[li++];
  const d=document.createElement('div');
  d.className=cls;d.textContent=txt;
  boot.appendChild(d);
  if(boot.children.length>5)boot.children[0].remove();
  setTimeout(nextLine, 380+Math.random()*220);
}
nextLine();

/* progress + status */
const fill=document.getElementById('fill'),pct=document.getElementById('pct');
const status=document.querySelector('.status');
const stages=['INITIALIZING','DECRYPTING','LINKING','CALIBRATING','SYNCING','READY'];
let p=0;
const stage=document.getElementById('stage');
function tick(){
  p+=Math.random()*2.4+0.6;
  if(p>=100){p=100;done();return}
  fill.style.width=p+'%';
  pct.textContent=String(Math.floor(p)).padStart(3,'0')+'%';
  const si=Math.min(stages.length-1,Math.floor(p/18));
  status.innerHTML=stages[si]+'<span class="dots"></span>';
  // random glitch slice
  if(Math.random()<0.08)glitchSlice();
  // micro shake when high
  if(p>70)stage.classList.add('shake');else stage.classList.remove('shake');
  setTimeout(tick,80+Math.random()*120);
}

const flx=document.getElementById('flx');
setInterval(()=>{flx.textContent=(1.8+Math.random()*1.4).toFixed(1)},300);

function glitchSlice(){
  const g=document.getElementById('glitch');
  g.style.top=(Math.random()*100)+'%';
  g.style.height=(2+Math.random()*14)+'px';
  g.style.opacity=.8;
  setTimeout(()=>g.style.opacity=0,80);
}

function done(){
  fill.style.width='100%';
  pct.textContent='100%';
  status.innerHTML='READY';
  stage.classList.remove('shake');
  // flash + reveal
  document.getElementById('flash').classList.add('go');
  setTimeout(()=>{
    document.getElementById('stage').style.display='none';
    document.getElementById('complete').classList.add('show');
    setTimeout(()=>{ window.location.href='cipher-flux.html'; }, 2200);
  },600);
}
setTimeout(tick,400);
</script>
</body>
</html>
